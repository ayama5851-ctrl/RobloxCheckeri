
name: Extract Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o RobloxCheckerAndroid_Source.zip -d extracted
          cp -R extracted/RobloxCheckerAndroid/app .
          cp extracted/RobloxCheckerAndroid/build.gradle .
          cp extracted/RobloxCheckerAndroid/settings.gradle .
          cp extracted/RobloxCheckerAndroid/gradle.properties .

      - name: Save files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app build.gradle settings.gradle gradle.properties
          git commit -m "Add Android project files" || true
          git push
