name: Extract Android Project

on:
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o RobloxCheckerAndroid_Source.zip -d extracted
          cp -R extracted/RobloxCheckerAndroid/. .

      - name: Save files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract Android project" || true
          git push
